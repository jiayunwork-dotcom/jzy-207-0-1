services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yard
      POSTGRES_PASSWORD: yard
      POSTGRES_DB: yardstress
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yard -d yardstress"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONFIG_PATH: /etc/yardstress/config.yaml
      DATABASE_URL: postgres://yard:yard@db:5432/yardstress?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata:
