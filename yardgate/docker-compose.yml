services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://yard:yard@db:5432/yardgate?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yard
      POSTGRES_PASSWORD: yard
      POSTGRES_DB: yardgate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yard -d yardgate"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
